<x-dc>
<helmet>

<div style="min-height: 100vh; background: #f4f4f0; color: #000; font-family: 'Space Mono', monospace; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background-image: repeating-linear-gradient(0deg, transparent, transparent 47px, #00000012 47px, #00000012 48px)" data-screen-label="Login">

      <h1 style="font-family: 'Archivo Black', sans-serif; font-size: 40px; margin: 0; line-height: 1; text-transform: uppercase; letter-spacing: -1px">Mail-AI</h1>

    </div>
    <div style="display: flex; height: 12px; border-bottom: 4px solid #000"><div style="flex: 1; background: #f8e800"></div><div style="flex: 1; background: #1a3cff"></div><div style="flex: 1; background: #00d95f"></div></div>

      <p style="margin: 0; font-size: 14px; line-height: 1.6">Sign in to draft emails with AI and send them from your own Gmail. Nothing sends without your approval.</p>
      <a href="Composer.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; background: #f4f4f0; color: #000; border: 3px solid #000; box-shadow: 6px 6px 0 #000; padding: 16px 20px; font-family: 'Archivo Black', sans-serif; font-size: 15px; text-transform: uppercase; text-decoration: none; cursor: pointer" style-hover="transform: translate(3px,3px); box-shadow: 3px 3px 0 #000; color: #000" style-active="transform: translate(6px,6px); box-shadow: 0 0 0 #000">

      <p style="margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-top: 2px solid #000; padding-top: 14px">Read-only Gmail access <span style="color: #1a3cff">▸</span> used to match your writing style</p>
